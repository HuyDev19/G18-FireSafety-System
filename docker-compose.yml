services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data

  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set myminio http://minio:9000 minio_admin password123) do
        echo 'Waiting for MinIO to be ready...'
        sleep 2
      done
      mc mb -p myminio/pccc-documents || true
      mc anonymous set none myminio/pccc-documents
      echo 'Bucket pccc-documents created and set to private'
      "

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - minio
    environment:
      DATABASE_URL: "postgresql://neondb_owner:npg_2uzDq5IARQgb@ep-winter-frost-aoqfeygz-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: g18_pccc_jwt_secret_key_change_me_in_production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: password123
      MINIO_BUCKET_NAME: pccc-documents

volumes:
  minio_data:
