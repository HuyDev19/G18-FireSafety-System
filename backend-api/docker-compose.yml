services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: g18-postgres
    restart: always
    environment:
      POSTGRES_USER: admin_pccc
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: g18_fire_safety_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: elestio/minio:latest
    container_name: g18-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin_pccc
      MINIO_ROOT_PASSWORD: password123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: