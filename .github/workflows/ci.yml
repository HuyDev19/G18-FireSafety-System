name: CI

permissions:
  contents: read

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci_user:ci_pass@localhost:5432/ci_db?sslmode=disable' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-dummy-jwt-secret-not-for-production' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-dummy-jwt-refresh-secret-not-for-production' }}
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d
    steps:
      - name: Mã nguồn checkout
        uses: actions/checkout@v4
      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json
      - name: Cài dependencies
        run: npm ci
      - name: Sinh Prisma Client
        run: npx prisma generate
      - name: Kiểm tra lint
        run: |
          if [ -x node_modules/.bin/eslint ]; then
            npm run lint
          else
            echo "::warning::backend-api chưa cài eslint trong devDependencies - tạm bỏ qua lint, chờ Role 3 bổ sung"
          fi
      - name: Kiểm tra kiểu TypeScript
        run: npx tsc --noEmit
      - name: Chạy unit test
        run: npm test --if-present -- --passWithNoTests
      - name: Build
        run: npm run build

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-web
    env:
      VITE_API_BASE_URL: http://localhost:3000/api
    steps:
      - name: Mã nguồn checkout
        uses: actions/checkout@v4
      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Cài dependencies
        run: npm ci
      - name: Kiểm tra kiểu TypeScript
        run: npx tsc -b
      - name: Build
        run: npm run build
