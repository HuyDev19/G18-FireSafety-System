name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend-api/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend-api
          npm ci

      - name: Check TypeScript Compilation
        run: |
          cd backend-api
          npx tsc --noEmit

      - name: Run Linter
        run: |
          cd backend-api
          npm run lint --if-present

      - name: Build Backend
        run: |
          cd backend-api
          npm run build

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend-web
          npm ci --legacy-peer-deps || npm install

      - name: Run Linter
        run: |
          cd frontend-web
          npm run lint --if-present

      - name: Build Frontend
        run: |
          cd frontend-web
          npm run build